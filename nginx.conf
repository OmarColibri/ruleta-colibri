server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # HTML, CSS y JS: el navegador siempre pregunta si hay versión nueva (responde 304 si no cambió).
    # Así un deploy nuevo se ve de inmediato y nunca se mezcla HTML nuevo con JS viejo.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Imágenes e íconos: caché de 7 días
    location ~* \.(jpg|jpeg|png|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
